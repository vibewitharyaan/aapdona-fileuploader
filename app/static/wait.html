<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f6e8c8">
<title>Patience! - AAP DO NA - Uploads</title>
<link rel="icon" href="/static/favicon.png" type="image/png">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="shapes" aria-hidden="true">
  <i class="sq sq1"></i><i class="sq sq2"></i><i class="squig squig1"></i><i class="dot dot3"></i><i class="ring ring1"></i>
</div>
<main class="wrap">
<section class="card">
  <header class="brand small">
    <img class="logo" src="/static/logo.png" alt="AAP DO NA logo">
    <div>
      <h1>Hold on!</h1>
      <p class="sub">file is still <b>coming</b> through</p>
    </div>
  </header>
  <p class="banner">Your link is fine, the file is still being uploaded.</p>
  <div class="stat">
    <span>File</span><b id="name">…</b>
  </div>
  <div class="stat">
    <span>Uploaded</span><b id="progress">…</b>
  </div>
  <div class="bar"><div id="fill"></div></div>
  <div id="pct" class="hint"></div>
  <p class="hint" id="status">uploading…</p>
  <p class="hint">the download button will appear once the file is ready.</p>
</section>
</main>
<script src="/static/wait.js?v=2" defer></script>
</body>
</html>
